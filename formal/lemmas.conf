# Per-lemma configuration for tool/prove_formal.sh (also used by CI).
# Columns: model  lemma  timeout-seconds  tag  [extra tamarin-prover flags]
#   tag ci   : proved locally and in .github/workflows/formal.yml
#   tag long : documented in formal/RESULTS.md, skipped by --skip-long (CI)
# Timeouts are the locally measured times (formal/RESULTS.md) with a margin of
# roughly 7x for the slower CI runner. A trailing '# ...' is a comment.
